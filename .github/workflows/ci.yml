name: CI

on:
  push:
    branches: [main, rust-port]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: wireview-nexus

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: wireview-nexus
      # wireview-core lives in the companion repository, expected next to this one.
      # Same branch or tag there if it exists, else its main branch.
      - name: Companion repository
        shell: bash
        working-directory: .
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          # Exact refs: a bare pattern would also match refs/heads/feature/<REF>. Release
          # tags are checked by release.yml, whose clone of the same tag fails on its own.
          if git ls-remote --exit-code https://github.com/jlobue10/wireview-xeneon-edge "refs/heads/$REF" "refs/tags/$REF" >/dev/null; then
            git clone --depth 1 --branch "$REF" https://github.com/jlobue10/wireview-xeneon-edge
          else
            echo "::warning::no $REF in wireview-xeneon-edge; building against its main branch"
            git clone --depth 1 https://github.com/jlobue10/wireview-xeneon-edge
          fi
      - name: Fonts for the render tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Installer regressions
        shell: pwsh
        run: ./tests/installer.test.ps1
      - name: Linux installer regressions
        if: runner.os == 'Linux'
        run: sh tests/installer.test.sh
